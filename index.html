<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Simulador de móvil - Obligatorio 2 SIG</title>

    <script src="config.js"></script>
    <script type="module" src="https://js.arcgis.com/5.1/"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <arcgis-map center="-98, 39" zoom="5">
      <arcgis-directions slot="top-right"></arcgis-directions>
      <calcite-panel slot="top-left" heading="Ruta">
        <calcite-button id="btn-iniciar">Iniciar simulación</calcite-button>
        <calcite-button id="btn-paradas">Borrar paradas</calcite-button>
        <calcite-button id="btn-rutas">Borrar rutas</calcite-button>
      </calcite-panel>
    </arcgis-map>

    <script type="module">
      const [RouteLayer, Basemap, TileLayer, FeatureLayer, Graphic, Point, Polyline, webMercatorUtils] = await $arcgis.import([
        "@arcgis/core/layers/RouteLayer.js",
        "@arcgis/core/Basemap.js",
        "@arcgis/core/layers/TileLayer.js",
        "@arcgis/core/layers/FeatureLayer.js",
        "@arcgis/core/Graphic.js",
        "@arcgis/core/geometry/Point.js",
        "@arcgis/core/geometry/Polyline.js",
        "@arcgis/core/geometry/support/webMercatorUtils.js"
      ]);

      const viewElement = document.querySelector("arcgis-map");
      const directionsElement = document.querySelector("arcgis-directions");

      // Mapa base 
      viewElement.basemap = new Basemap({
        baseLayers: [
          new TileLayer({
            url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer",
          }),
        ],
      });

      const eventos_url = "https://sampleserver5.arcgisonline.com/arcgis/rest/services/LocalGovernment/Events/FeatureServer/0";
      const trails_url = "https://sampleserver5.arcgisonline.com/arcgis/rest/services/LocalGovernment/Recreation/FeatureServer/1";

      const event_id = 52026 //grupo 5 año 2026
      const ruta_prefix = "grupo5_2026"
      
      const eventosLayer = new FeatureLayer({
        url: eventos_url,
        definitionExpression: `eventid = ${event_id}`,
        outFields: ["*"],
        popupTemplate: { title: "{description}" },
      });

      const routeLayer = new RouteLayer({});

      const trailsLayer = new FeatureLayer({
        url: trails_url,
        definitionExpression: `notes LIKE '${ruta_prefix}|%'`,
        outFields: ["*"],
      });

      await viewElement.viewOnReady();
      await directionsElement.componentOnReady();
      await routeLayer.load();

      // Capa de ruta propia, asociada al componente y agregada al mapa
      directionsElement.layer = routeLayer;
      viewElement.map.add(routeLayer);
      viewElement.map.add(trailsLayer)
      viewElement.map.add(eventosLayer)

      function paradaAGraphic(parada, indice) {
        // Punto nuevo en 4326, armado con los grados del punto en WebMercator
        const punto = new Point({
          longitude: parada.geometry.longitude,
          latitude: parada.geometry.latitude,
        });

        return new Graphic({
          geometry: punto,
          attributes: {
            description: (parada.name ?? `Parada ${indice+1}`).slice(0,50),
            event_type: 5, // ToDo: el tipo elegido por el usuario (? ver como resolver) 
            eventid: event_id,
            eventdate: Date.now(),
          },
        });
      }

      async function guardarEventos() {
        const paradas = routeLayer.stops.toArray().filter((p) => p.geometry);
        const graphics = paradas.map(paradaAGraphic);

        const resultado = await eventosLayer.applyEdits({ addFeatures: graphics });
        
        const errores = resultado.addFeatureResults.filter((r) => r.error);
        if (errores.length > 0) {
          throw new Error(errores.map((r) => r.error.message).join(";"));
        }

        // los ids vienen en el mismo orden que las paradas
        return resultado.addFeatureResults.map((r) => r.objectId);
      }

      async function guardarRuta(idsEventos) {
        const geometriaWM = routeLayer.routeInfo?.geometry;
        if (!geometriaWM) throw new Error("Todavía no hay una ruta calculada.");

        // 1. A grados (4326)
        const geo = webMercatorUtils.webMercatorToGeographic(geometriaWM);

        // 2. Reconstruir solo con x,y, por si la geometría trae Z o M (la capa no los admite)
        const linea = new Polyline({
          paths: geo.paths.map((trazo) => trazo.map((v) => [v[0], v[1]])),
          spatialReference: { wkid: 4326 },
        });

        // 3. Atributos: marca | nombre | ids de eventos en orden de visita
        const listaIds = idsEventos.join(",");
        const nombre = "Ruta de prueba";  // Cambiar por un nombre que ingresa el usuario ???
        const notes = `${ruta_prefix}|${nombre.slice(0, 40)}|${listaIds}`;
        if (notes.length > 255) {
          throw new Error("La ruta tiene demasiados eventos para el campo notes.");
        }

        const resultado = await trailsLayer.applyEdits({
          addFeatures: [
            new Graphic({
              geometry: linea,
              attributes: { notes, trailtype: 4, recordedon: Date.now() },
            }),
          ],
        });

        const r = resultado.addFeatureResults[0];
        if (r.error) throw new Error(r.error.message);
        return r.objectId
      }

      async function borrarPropios(layer, where) {
        if (!where || !where.trim()) {
          throw new Error("Condición de borrado vacía: no se borra nada.");
        }
        const ids = await layer.queryObjectIds({ where });
        if (ids.length === 0) return 0;

        const resultado = await layer.applyEdits({
          deleteFeatures: ids.map((objectId) => ({ objectId })),
        });
        const errores = resultado.deleteFeatureResults.filter((r) => r.error);
        if (errores.length > 0) {
          throw new Error(errores.map((r) => r.error.message).join("; "));
        }
        return ids.length;
      }


      // Prueba para ver como se toman las paradas y la ruta, tomando como referencia el evento de cambio de arcgis
      // No nos sirvió porque a cada cambio en las paradas dispara el evento, y no queremos que guarde hasta que comience la simulación (? resolver)

          // tambien el campo spatialReference determina que sus coordenadas son de tipo webMercator (investigar más sobre esto)

                const resultado = eventos.applyEdits({
                addFeatures: [

                    attributes: { description: parada.name, event_type: 5, eventid: 5202601, eventdate: Date.now() },
                  }),
                ],
              });
            }
          })
          console.log(route.geometry)
        }
      });
      */

        addFeatures: [
          new Graphic({
            geometry: new Point({ longitude: -98, latitude: 39 }),
            attributes: { description: "Prueba", event_type: 5, eventid: 5202601, eventdate: Date.now() },
          }),
        ],
        deleteFeatures: [
        ]
      });
      console.log(resultado.addFeatureResults);
      console.log(resultado.deleteFeatureResults)
      // Hasta aca
      */

      // Este es el codigo que debe ejecutarse cuando le damos al boton de iniciar simulacion
      // Esto quiere decir, guardar las paradas, guardar la ruta, comenzar la simulación, y deshabilitar el resto de la interfaz
      // Además de comenzar con la operacion de la población y tener en cuenta la velocidad y el radio de amplitud
      document.querySelector("#btn-iniciar").addEventListener("click", async () => {
        // 1. leer routeLayer.stops y routeInfo en este momento
        // 2. validar
        // 3. guardar
        document.querySelector("#btn-iniciar").disabled = true;
        let idsEventos = [];
        try {
          idsEventos = await guardarEventos();
          await guardarRuta(idsEventos);
          eventosLayer.refresh();
          // TODO: pasar a modo simulación
        } catch (error) {
          // Si los eventos ya se guardaron y la ruta no, quedan "huérfanos": se deshace
          if (idsEventos.length > 0) {
            await eventosLayer.applyEdits({
              deleteFeatures: idsEventos.map((objectId) => ({ objectId })),
            });
          }
          console.error(error);
          // TODO: avisar al usuario
        } finally {
          document.querySelector("#btn-iniciar").disabled = false;
        }
      });

      document.querySelector("#btn-paradas").addEventListener("click", async () => {
        if (!confirm("¿Borrar todos tus eventos guardados?")) return;
          try {
            const n = await borrarPropios(eventosLayer, `eventid = ${event_id}`);
            eventosLayer.refresh();
            console.log(`Eventos borrados: ${n}`);
          } catch (error) {
            console.error(error);
          }
      });

      document.querySelector("#btn-rutas").addEventListener("click", async () => {
         if (!confirm("¿Borrar todas tus rutas guardadas?")) return;
          try {
            const n = await borrarPropios(trailsLayer, `notes LIKE '${ruta_prefix}%'`);
            console.log(`Rutas borradas: ${n}`);
          } catch (error) {
            console.error(error);
          }
      });
    </script>
  </body>
