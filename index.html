<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Rutas EE.UU</title>

    <script src="config.js"></script>
    <script type="module" src="https://js.arcgis.com/5.1/"></script>
    <script type="module" src="js/main.js"></script> <!-- ATENCIÓN!! Esta modularizacion implica levantar un servidor http mediante el comando python "python -m http.server" en la carpeta donde esté el archivo index.html, y para ejecutar abrimos 'http://localhost:8000'-->
    <link rel="stylesheet" type="text/css" href="css/style.css">
  </head>

  <body>
    <arcgis-map center="-98, 39" zoom="5">
      <arcgis-directions slot="top-right"></arcgis-directions>
      <calcite-panel slot="top-left" heading="Ruta">
        <calcite-button id="btn-iniciar">Iniciar simulación</calcite-button>
        <calcite-button id="btn-rutas">Borrar rutas</calcite-button>
        <calcite-button id="btn-todo">Borrar todo</calcite-button>
      </calcite-panel>
    </arcgis-map>
  </body>
</html>
